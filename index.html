<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chronia</title>
<meta name="description" content="A live profile card set in an interactive pixel forest kingdom.">
<meta name="theme-color" content="#1d3b2f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect width='32' height='32' rx='5' fill='%231d3b2f'/%3E%3Cpath fill='%23ffd166' d='M6 9h5v14H6zm7-4h6v18h-6zm8 4h5v14h-5zM4 23h24v5H4z'/%3E%3Cpath fill='%23f4a261' d='M4 25h24v3H4z'/%3E%3Cpath fill='%23fff8e7' d='M14 17h4v2h-4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#8fd3e8;
    --sky-2:#d9f2d0;
    --hill:#74c69d;
    --hill-2:#52b788;
    --tree-far:#2d6a4f;
    --tree-near:#1b4332;
    --trunk:#6b4226;
    --ground:#40916c;
    --grass:#2d6a4f;
    --grass-deep:#1b4332;
    --gold:#ffd166;
    --amber:#f4a261;
    --cream:#fff8e7;
    --muted:#d8efcf;
    --wood:#8b5a2b;
    --wood-dark:#4a2e18;
    --panel:#1d3b2f;
    --panel-2:#27503d;
    --ink:var(--cream);
    --ink-2:var(--muted);
    --ink-3:#a9d3bd;
    --firefly:#fff3a0;
    --font-pixel:"Press Start 2P","Courier New",monospace;
    --font-body:"Pixelify Sans","Courier New",monospace;
    --px:0;
    --py:0;
  }

  /* Scene palettes are written continuously as inline variables on body. */

  *,*::before,*::after{box-sizing:border-box}
  html,body{min-height:100%}

  /* Viewport boundary: decorative scenery and edge tooltips cannot widen the document. */
  html{overflow-x:clip}
  body{
    margin:0;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:32px 20px;
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    background:var(--sky-1);
    overflow-x:hidden;
  }

  /* ---------- the kingdom ---------- */
  .world{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .sky{position:absolute;inset:0}
  .sky--day{background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 72%)}
  .sky--night{background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 72%);opacity:var(--night-opacity,0)}

  .starfield{
    position:absolute;inset:0 0 46%;
    opacity:var(--star-opacity,0);
    background-image:
      radial-gradient(2px 2px at 24px 34px,#fff8e7 99%,transparent),
      radial-gradient(2px 2px at 138px 88px,#fff8e7 99%,transparent),
      radial-gradient(3px 3px at 82px 142px,#ffd166 99%,transparent),
      radial-gradient(2px 2px at 186px 24px,#fff8e7 99%,transparent);
    background-size:220px 170px;
  }

  .sun,.moon{
    position:absolute;
    width:60px;height:60px;
  }
  .sun{
    left:var(--sun-x,8%);
    top:var(--sun-y,10%);
    opacity:var(--sun-opacity,0);
    background:var(--gold);
    box-shadow:0 0 0 8px rgba(255,209,102,.16),0 0 48px rgba(255,209,102,.55);
  }
  .moon{
    left:var(--moon-x,79%);
    top:var(--moon-y,10%);
    opacity:var(--moon-opacity,0);
    background:#f2f6d9;
    box-shadow:0 0 0 8px rgba(242,246,217,.12),0 0 44px rgba(242,246,217,.45);
  }

  .layer{position:absolute;pointer-events:none;transition:transform .3s steps(5,end)}
  /* Hill bodies reach the viewport floor; only the jagged tops are clipped, so parallax
     can never expose sky beneath them. The taller boxes keep the crest line in place. */
  .layer--hills{
    left:-6%;right:-6%;bottom:0;height:53%;
    background:var(--hill);
    clip-path:polygon(0 100%,0 66%,8% 48%,15% 62%,23% 32%,31% 58%,39% 42%,47% 68%,56% 26%,64% 56%,73% 38%,81% 62%,89% 44%,96% 64%,100% 52%,100% 100%);
    transform:translate3d(calc(var(--px) * 6px),calc(var(--py) * 3px),0);
  }
  .layer--hills-2{
    left:-6%;right:-6%;bottom:0;height:42%;
    background:var(--hill-2);
    clip-path:polygon(0 100%,0 58%,10% 38%,19% 60%,28% 30%,37% 62%,47% 40%,56% 64%,66% 34%,75% 60%,85% 40%,94% 62%,100% 48%,100% 100%);
    transform:translate3d(calc(var(--px) * 10px),calc(var(--py) * 5px),0);
  }
  /* Grass lives inside the ground layer to inherit its parallax, but the jagged
     terrain shape is clipped on the ground's ::before so blades are never cut
     off. Each --b is matched to the terrain vertex at that x, minus a small
     embed so tufts look planted. Two depth layers, each on its own sway clock. */
  .grass{position:absolute;inset:0;z-index:1;pointer-events:none}
  .blade{
    position:absolute;
    left:calc(var(--x) * 1%);
    bottom:var(--b,78%);
    width:var(--w,20px);height:var(--h,24px);
    background:var(--grass);
    clip-path:polygon(0 100%,0 56%,18% 22%,30% 62%,50% 0,70% 60%,82% 24%,100% 54%,100% 100%);
    transform-origin:50% 100%;
    animation:grassSway 3s steps(4,end) infinite alternate;
    animation-delay:calc(var(--d,0) * -.37s);
  }
  .blade--deep{background:var(--grass-deep);height:calc(var(--h,24px) * 1.3);opacity:.78}
  /* Very short screens fill the viewport with the card; top-align it so the
     lower scene still has room to breathe. */
  @media (max-width:699px) and (max-height:700px){
    body{align-items:start}
  }

  .tree{position:absolute;bottom:9%;left:calc(var(--x) * 1%);width:var(--w);height:var(--h)}
  .tree::before{
    content:"";position:absolute;inset:0 0 14%;
    background:var(--tree-far);
    clip-path:polygon(50% 0,62% 22%,56% 22%,71% 45%,63% 45%,81% 72%,70% 72%,94% 100%,6% 100%,30% 72%,19% 72%,37% 45%,29% 45%,44% 22%,38% 22%);
    z-index:1;
  }
  .tree::after{content:"";position:absolute;left:46%;bottom:0;width:8%;height:18%;background:var(--trunk);z-index:-1}
  .tree--far{opacity:.9;transform:translate3d(calc(var(--px) * 18px),calc(var(--py) * 7px),0)}
  .tree--near{z-index:1;transform:translate3d(calc(var(--px) * 27px),calc(var(--py) * 11px),0)}
  .tree--near::before{background:var(--tree-near)}
  .tree--near::after{background:var(--wood-dark)}

  .layer--ground{
    left:-12%;right:-12%;bottom:-6%;height:24%;
    transform:translate3d(calc(var(--px) * 34px),calc(var(--py) * 12px),0);
  }
  /* Terrain shape lives on ::before, not the layer itself: a clip-path on the
     layer would also clip the nested grass blades that rise above the crest. */
  .layer--ground::before{
    content:"";position:absolute;inset:0;
    background:var(--ground);
    clip-path:polygon(0 22%,4% 12%,9% 22%,14% 10%,20% 22%,26% 13%,32% 23%,38% 11%,45% 22%,52% 12%,59% 23%,66% 10%,73% 22%,80% 13%,87% 23%,94% 11%,100% 22%,100% 100%,0 100%);
  }
  .bloom{position:absolute;bottom:12%;width:6px;height:6px;z-index:1;box-shadow:0 0 0 2px rgba(0,0,0,.12)}
  .bloom--pink{background:#ff77a8}
  .bloom--gold{background:var(--gold)}
  .bloom--cream{background:var(--cream)}

  .fireflies{
    position:absolute;inset:0;pointer-events:none;z-index:2;
    opacity:1;visibility:visible;
    transition:opacity .45s steps(5,end),visibility 0s;
  }
  /* Daylight hides the whole layer: stepped fade out, then it leaves the hit-test tree. */
  body[data-scene="day"] .fireflies{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .45s steps(5,end),visibility 0s .45s;
  }
  body[data-scene="day"] .firefly{pointer-events:none}
  .firefly{
    position:absolute;
    left:calc(var(--x) * 1%);
    top:calc(var(--y) * 1%);
    width:8px;height:8px;
    padding:0;border:0;
    background:var(--firefly);
    box-shadow:0 0 0 3px rgba(255,243,160,.16),0 0 18px 5px rgba(255,243,160,.6);
    cursor:pointer;
    pointer-events:auto;
    animation:flyDrift 3.4s steps(4,end) infinite alternate,flyBlink 1.5s steps(2,end) infinite;
    animation-delay:calc(var(--d) * -.37s);
    transition:left 1.7s steps(8,end),top 1.7s steps(8,end),opacity .2s;
  }
  .firefly::after{content:"";position:absolute;inset:-9px}
  .firefly.caught,.firefly:disabled{animation-name:flyDrift;opacity:0}
  .firefly:focus-visible{outline:2px solid var(--cream);outline-offset:4px}

  .hero-layer{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .sparks{position:fixed;inset:0;z-index:6;pointer-events:none}
  .spark{
    position:absolute;width:5px;height:5px;
    background:var(--firefly);
    box-shadow:0 0 10px var(--firefly);
    animation:sparkOut .6s steps(6,end) forwards;
  }

  .hero{
    position:absolute;
    bottom:8%;left:50%;
    width:64px;height:64px;
    background:url("hero.png") 0 0/192px 64px no-repeat;
    image-rendering:pixelated;
    transform:translateX(-50%);
    /* `translate` is independent of `transform`, so the facing flip is preserved. */
    translate:0 0;
    animation:heroIdle 2.6s steps(4,end) infinite;
    transition:left .28s steps(6,end),bottom .28s steps(6,end);
    pointer-events:none;
    z-index:3;
  }
  .hero.facing-left{transform:translateX(-50%) scaleX(-1)}
  .hero.walking{animation:heroWalk .48s steps(3,end) infinite}
  .hero::after{content:"";position:absolute;left:14%;bottom:-5px;width:72%;height:6px;background:rgba(0,0,0,.22)}
  /* Dust sits at local `left` only. The facing flip mirrors the whole hero,
     so it trails behind automatically; a `facing-left` override double-flips
     it and pins the trail to one side. */
  .hero::before{
    content:"";position:absolute;left:-14px;bottom:6px;
    width:6px;height:6px;
    background:var(--muted);
    box-shadow:7px 5px 0 -2px var(--muted),14px 1px 0 -3px var(--muted);
    opacity:0;
  }
  .hero.walking::before{animation:dustTrail .42s steps(3,end) infinite}
  .hero-bubble{
    position:absolute;
    left:50%;bottom:calc(8% + 74px);
    transform:translateX(-50%) translateY(6px);
    padding:6px 9px;
    background:var(--cream);
    color:var(--wood-dark);
    border:3px solid var(--wood-dark);
    box-shadow:4px 4px 0 rgba(0,0,0,.4);
    font-family:var(--font-pixel);
    font-size:10px;
    line-height:1.4;
    white-space:nowrap;
    opacity:0;
    transition:opacity .18s steps(3,end),transform .18s steps(3,end),left .28s steps(6,end),bottom .28s steps(6,end);
  }
  .hero-bubble[data-show="true"]{opacity:1;transform:translateX(-50%) translateY(0)}
  .hero-bubble::after{
    content:"";position:absolute;left:50%;bottom:-12px;
    width:0;height:0;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--wood-dark);
  }

  /* ---------- pixel campfire ---------- */
  .campfire-layer{position:fixed;inset:0;z-index:1;pointer-events:none}
  .campfire{
    position:absolute;
    left:28%;bottom:6%;
    width:58px;height:48px;
    padding:0;border:0;border-radius:0;
    background:none;box-shadow:none;
    color:inherit;
    pointer-events:auto;
    image-rendering:pixelated;
    cursor:pointer;
  }
  .campfire:hover:not(:disabled){filter:none}
  .campfire:active:not(:disabled){transform:none;box-shadow:none}
  .campfire:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
  .campfire__glow{
    position:absolute;left:50%;bottom:-6px;
    width:92px;height:46px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 100%,rgba(255,166,58,.5),rgba(255,209,102,0) 70%);
    opacity:0;
    transition:opacity .25s steps(4,end);
  }
  .campfire__logs i{
    position:absolute;
    left:8px;bottom:4px;width:42px;height:9px;
    background:var(--wood);
    box-shadow:inset 0 -3px 0 var(--wood-dark),0 2px 0 rgba(0,0,0,.35);
  }
  .campfire__logs i:nth-child(1){transform:rotate(16deg)}
  .campfire__logs i:nth-child(2){transform:rotate(-16deg)}
  .campfire__logs i:nth-child(3){left:15px;bottom:0;width:28px;height:8px;background:var(--wood-dark)}
  .campfire__flame{
    position:absolute;left:50%;bottom:11px;
    width:20px;height:27px;
    transform:translateX(-50%) scaleY(.18);
    transform-origin:50% 100%;
    opacity:0;
    transition:opacity .2s steps(3,end),transform .2s steps(3,end);
    clip-path:polygon(45% 0,60% 0,60% 18%,80% 18%,80% 46%,100% 46%,100% 100%,0 100%,0 46%,20% 46%,20% 18%,45% 18%);
  }
  .campfire__flame--back{width:28px;height:35px;bottom:9px;background:var(--amber)}
  .campfire__flame--mid{background:var(--gold)}
  .campfire__flame--core{width:10px;height:16px;bottom:13px;background:var(--cream)}
  .campfire[data-lit="true"] .campfire__glow{opacity:1}
  .campfire[data-lit="true"] .campfire__flame{
    opacity:1;
    transform:translateX(-50%) scaleY(1);
    animation:flameFlicker .46s steps(3,end) infinite alternate;
  }
  .campfire[data-lit="true"] .campfire__flame--back{animation-delay:-.14s}
  .campfire[data-lit="true"] .campfire__flame--core{animation-delay:-.28s}

  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:5;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(0,0,0,.16) 3px 4px);
    opacity:.22;
  }

  /* ---------- quest board ---------- */
  .shell{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    animation:rise .6s steps(6,end) both;
  }

  .wordmark{
    display:block;
    width:100%;
    height:auto;
    margin:0 auto 18px;
    /* Smooth scaling: `pixelated` drops the 1px bottom frame border when the
       597px asset is downscaled to 460px, making the wordmark look cut off. */
    image-rendering:auto;
    filter:
      drop-shadow(2px 0 0 var(--wood-dark))
      drop-shadow(-2px 0 0 var(--wood-dark))
      drop-shadow(0 2px 0 var(--wood-dark))
      drop-shadow(0 -2px 0 var(--wood-dark))
      drop-shadow(7px 7px 0 rgba(0,0,0,.55));
    animation:wordmarkIn .7s steps(5,end) .05s both;
  }

  .card{
    position:relative;
    border:4px solid var(--wood);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    box-shadow:
      0 0 0 4px var(--wood-dark),
      9px 9px 0 rgba(0,0,0,.45),
      0 0 34px rgba(255,209,102,.16);
    transform:perspective(900px) rotateX(calc(var(--py) * -3deg)) rotateY(calc(var(--px) * 4deg));
    transition:transform .2s steps(4,end);
  }

  .card__top{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    padding:10px 12px;
    background:var(--wood);
    border-bottom:4px solid var(--wood-dark);
  }
  .card__top::before{
    content:"";
    margin-right:auto;
    width:36px;height:10px;
    background:
      linear-gradient(var(--red,#ff6b6b),var(--red,#ff6b6b)) 0 0/10px 10px no-repeat,
      linear-gradient(var(--gold),var(--gold)) 13px 0/10px 10px no-repeat,
      linear-gradient(#8ce99a,#8ce99a) 26px 0/10px 10px no-repeat;
  }
  .counter{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--cream);
    font-family:var(--font-pixel);
    font-size:10px;
    opacity:1;visibility:visible;
    transition:opacity .45s steps(5,end),visibility 0s;
  }
  /* The counter tracks the firefly round, so it follows the same scene gate. */
  body[data-scene="day"] .counter{
    opacity:0;visibility:hidden;
    transition:opacity .45s steps(5,end),visibility 0s .45s;
  }
  .counter::before{
    content:"";
    width:8px;height:8px;
    background:var(--firefly);
    box-shadow:0 0 9px var(--firefly);
    transform:rotate(45deg);
  }

  button{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-pixel);
    font-size:10px;
    text-transform:uppercase;
    color:var(--wood-dark);
    background:var(--gold);
    border:2px solid var(--wood-dark);
    border-radius:0;
    padding:9px 10px;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--wood-dark);
    transition:transform .1s steps(2,end),box-shadow .1s steps(2,end),filter .1s;
  }
  button:hover:not(:disabled){filter:brightness(1.12)}
  button:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 var(--wood-dark)}
  button:disabled{opacity:.65;cursor:default}
  button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
  .identity{
    display:flex;
    align-items:center;
    gap:16px;
    padding:24px 18px 18px;
    animation:fadeIn .45s steps(4,end) .1s both;
  }
  .avatar-wrap{
    position:relative;
    flex:none;
    transform:translate3d(calc(var(--px) * 5px),calc(var(--py) * 4px),0);
    transition:transform .2s steps(4,end);
  }
  .avatar{
    position:relative;
    z-index:1;
    width:84px;height:84px;
    display:block;
    object-fit:cover;
    image-rendering:pixelated;
    border:4px solid var(--gold);
    box-shadow:0 0 0 3px var(--wood-dark),7px 7px 0 rgba(0,0,0,.5);
    animation:bob 2.4s steps(4,end) infinite;
  }
  .status-ring{
    position:absolute;
    z-index:2;
    right:-7px;bottom:-7px;
    width:20px;height:20px;
    border:3px solid var(--panel);
    color:#5f574f;
    background:currentColor;
    box-shadow:0 0 0 3px currentColor;
    animation:statusBlink 1.8s steps(2,end) infinite;
  }
  .status-ring[data-status="online"]{color:var(--green,#8ce99a)}
  .status-ring[data-status="idle"]{color:var(--gold)}
  .status-ring[data-status="dnd"]{color:#ff6b6b}
  .status-ring[data-status="offline"]{color:#5f574f}

  .names{min-width:0}
  .names h1{
    margin:0 0 10px;
    font-family:var(--font-pixel);
    font-size:17px;
    line-height:1.6;
    color:var(--gold);
    text-shadow:3px 3px 0 var(--wood-dark),6px 6px 0 rgba(0,0,0,.3);
    overflow-wrap:anywhere;
  }
  .handle{
    margin:0;
    font-family:var(--font-pixel);
    font-size:10px;
    line-height:1.7;
    color:#9ee6c4;
    overflow-wrap:anywhere;
  }

  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  .activity{
    margin:0 18px 4px;
    padding:13px 14px;
    border:3px solid #8ce99a;
    background:rgba(140,233,154,.09);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.3),5px 5px 0 rgba(0,0,0,.4);
  }
  .activity__kind{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0 0 8px;
    color:#8ce99a;
    font-family:var(--font-pixel);
    font-size:10px;
    line-height:1.6;
  }
  .activity__kind::before{
    content:"";
    width:8px;height:8px;
    flex:none;
    background:currentColor;
    box-shadow:0 0 0 2px var(--panel);
    animation:statusBlink 1.4s steps(2,end) infinite;
  }
  .activity__name{margin:0;font-size:16px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
  .activity__detail{margin:3px 0 0;color:var(--ink-2);font-size:14px;line-height:1.4;overflow-wrap:anywhere}

  .socials{
    margin:18px 18px 22px;
    padding-top:16px;
    border-top:3px dashed rgba(255,248,231,.25);
  }
  .socials__title{
    margin:0 0 12px;
    color:var(--gold);
    font-family:var(--font-pixel);
    font-size:10px;
    line-height:1.6;
  }
  .socials__list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:5px;
    margin:0;
    padding:0;
    list-style:none;
  }
  .socials__list li{opacity:0;animation:chipIn .4s steps(4,end) forwards;animation-delay:calc(.3s + var(--i) * 60ms)}
  .socials__list a{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:7px 7px;
    border:2px solid var(--wood-dark);
    background:var(--panel-2);
    color:var(--ink);
    font-size:13px;
    font-weight:600;
    line-height:1.2;
    text-decoration:none;
    box-shadow:4px 4px 0 var(--wood-dark);
    transition:transform .1s steps(2,end),box-shadow .1s steps(2,end),background .1s,color .1s;
  }
  .socials__list a::after{
    content:attr(data-lore);
    position:absolute;
    bottom:calc(100% + 9px);
    left:50%;
    width:max-content;max-width:190px;
    padding:7px 9px;
    background:#0f241c;
    border:2px solid var(--gold);

<script>
  const USER_ID = "987815885702041610";
  const ENDPOINT = `https://api.lanyard.rest/v1/users/${USER_ID}`;

  const el = {
    avatar: document.getElementById("avatar"),
    ring: document.getElementById("statusRing"),
    name: document.getElementById("name"),
    handle: document.getElementById("handle"),
    status: document.getElementById("statusText"),
    activity: document.getElementById("activity"),
    activityKind: document.getElementById("activityKind"),
    activityName: document.getElementById("activityName"),
    activityDetail: document.getElementById("activityDetail"),
    error: document.getElementById("error"),
  };

  const STATUS_LABELS = {
    online: "Online",
    idle: "Idle",
    dnd: "Do not disturb",
    offline: "Offline",
  };

  const ACTIVITY_KINDS = {
    0: "Playing",
    1: "Streaming",
    2: "Listening to",
    3: "Watching",
    4: "Custom",
    5: "Competing in",
  };

  const heroBubble = document.getElementById("heroBubble");
  let heroX = 50;
  let heroBottom = "8%";
  let bubbleTimer = 0;
  let greeted = false;

  function placeBubble() {
    if (!heroBubble) return;
    heroBubble.style.left = heroX + "%";
    heroBubble.style.bottom = `calc(${heroBottom} + 74px)`;
  }

  function say(text) {
    if (!heroBubble || !text) return;
    heroBubble.textContent = text;
    heroBubble.dataset.show = "true";
    placeBubble();
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => { heroBubble.dataset.show = "false"; }, 2400);
  }

  function avatarUrl(user) {
    const hash = user.avatar;
    if (typeof hash === "string" && /^[a-f0-9]{32}$/i.test(hash)) {
      return `https://cdn.discordapp.com/avatars/${USER_ID}/${hash}.png?size=256`;
    }
    const n = Number(user.discriminator);
    const fallback = Number.isFinite(n) ? Math.abs(n) % 5 : 0;
    return `https://cdn.discordapp.com/embed/avatars/${fallback}.png`;
  }

  /* Discord custom-status entries are activities too (name "Custom Status",
     id "custom"), but they aren't something you're actually playing. */
  function realActivities(data) {
    return (data.activities || []).filter(a =>
      a && !/custom/i.test(String(a.name || "")) && !/custom/i.test(String(a.id || ""))
    );
  }

  /* Lanyard reports Spotify either in its legacy `spotify` field or as a plain
     activity. Both are reduced to a track so the activity reads "Listening to"
     followed by the song name instead of the app name. In the legacy shape,
     `spotify.song` is a STRING (e.g. "Let Go"), not an object with `.title`. */
  function spotifyTrack(data) {
    if (data.listening_to_spotify && data.spotify) {
      const s = data.spotify;
      const song = typeof s.song === "string" ? { title: s.song } : (s.song || {});
      const title = String(song.title || s.title || "").trim();
      const artist = String(song.artist || s.artist || "").trim();
      if (title || artist) return { title: title || "Unknown track", artist };
    }
    const activity = realActivities(data).find(a => /spotify/i.test(a.name || ""));
    if (!activity) return null;
    const meta = activity.metadata || {};
    const title = String(activity.details || meta.title || meta.name || "").trim();
    const artist = String(activity.state || meta.artist || meta.artists || "").trim();
    if (!title && !artist) return null;
    return { title: title || "Unknown track", artist };
  }

  function currentActivity(data) {
    const track = spotifyTrack(data);
    if (track) {
      return {
        kind: "Listening to",
        name: track.title,
        detail: track.artist ? `by ${track.artist}` : "",
      };
    }

    const a = realActivities(data)[0];
    if (!a) return null;

    if (a.type === 4) {
      return { kind: "Custom", name: a.state || a.details || "Custom status", detail: "" };
    }

    const detail = [a.details, a.state].filter(Boolean).join(" · ");
    return {
      kind: ACTIVITY_KINDS[a.type] || "Doing",
      name: a.name || "Something",
      detail,
    };
  }

  let errorShowing = false;
  let alertToken = 0;

  function render(data) {
    const user = data.discord_user || {};
    const status = STATUS_LABELS[data.discord_status] ? data.discord_status : "offline";

    el.avatar.src = avatarUrl(user);
    el.avatar.alt = `${user.display_name || user.global_name || user.username || "Discord user"}'s avatar`;
    el.name.textContent = user.display_name || user.global_name || user.username || "Unknown user";

    const tag = user.discriminator && user.discriminator !== "0" ? `#${user.discriminator}` : "";
    el.handle.textContent = `@${user.username || "unknown"}${tag}`;

    el.ring.dataset.status = status;
    const label = STATUS_LABELS[status];
    if (el.status.textContent !== label) el.status.textContent = label;
    if (!el.error.hidden) {
      alertToken++;
      el.error.hidden = true;
      errorShowing = false;
    }

    const activity = currentActivity(data);
    el.activity.hidden = !activity;
    if (activity) {
      el.activityKind.textContent = activity.kind;
      el.activityName.textContent = activity.name;
      el.activityDetail.textContent = activity.detail;
      el.activityDetail.hidden = !activity.detail;
    }

    if (!greeted) {
      greeted = true;
      say("Hey, traveler!");
    }
  }

  function showError(message) {
    el.name.textContent = "Presence unavailable";
    el.handle.textContent = "";
    el.avatar.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E";
    el.avatar.alt = "";
    el.activity.hidden = true;
    el.ring.dataset.status = "offline";
    if (el.status.textContent !== "Unavailable") el.status.textContent = "Unavailable";

    const text = `Couldn't load presence: ${message}. Check your connection and try again.`;
    if (!errorShowing) {
      el.error.hidden = false;
      const token = ++alertToken;
      const write = () => {
        if (token !== alertToken || el.error.hidden) return;
        el.error.textContent = text;
      };
      requestAnimationFrame(write);
      setTimeout(write, 50);
    } else if (el.error.textContent !== text) {
      alertToken++;
      el.error.textContent = text;
    }
    errorShowing = true;
  }

  const REQUEST_TIMEOUT = 12000;
  const RETRY_DELAY = 400;
  let restLoading = false;

  async function fetchPresence() {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT);
    try {
      const response = await fetch(ENDPOINT, { cache: "no-store", signal: controller.signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const json = await response.json();
      if (!json.success || !json.data) throw new Error("profile not found");
      return json.data;
    } finally {
      clearTimeout(timer);
    }
  }

  async function loadREST({ silent = false } = {}) {
    if (restLoading) return;
    restLoading = true;
    if (!silent && el.status.textContent !== "Connecting to Lanyard…") {
      el.status.textContent = "Connecting to Lanyard…";
    }

    try {
      let data;
      try {
        data = await fetchPresence();
      } catch (firstError) {
        // A second attempt recovers from slow first connections and brief drops.
        if (firstError.message === "profile not found") throw firstError;
        await new Promise((resolve) => setTimeout(resolve, RETRY_DELAY));
        data = await fetchPresence();
      }
      render(data);
    } catch (err) {
      showError(err.name === "AbortError" ? "request timed out" : (err.message || "network error"));
    } finally {
      restLoading = false;
    }
  }

  /* The socket pushes presence changes as they happen, so the 10s poll is gone.
     REST is kept only as a one-off fallback if the socket never delivers data. */
  const SOCKET_URL = "wss://api.lanyard.rest/socket";
  const INITIAL_RECONNECT_DELAY = 1000;
  const MAX_RECONNECT_DELAY = 30000;
  let socket = null;
  let heartbeatTimer = 0;
  let reconnectTimer = 0;
  let socketStartupTimer = 0;
  let reconnectDelay = INITIAL_RECONNECT_DELAY;
  let hasPresence = false;
  let restFallbackTried = false;

  function clearHeartbeat() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = 0;
  }

  function presenceFromMessage(msg) {
    if (!msg || msg.op !== 0) return null;
    if (msg.t === "INIT_STATE") {
      const d = msg.d || {};
      if (d[USER_ID]) return d[USER_ID];
      return d.discord_user && (!d.user_id || d.user_id === USER_ID) ? d : null;
    }
    if (msg.t === "PRESENCE_UPDATE") {
      const d = msg.d || {};
      return !d.user_id || d.user_id === USER_ID ? d : null;
    }
    return null;
  }

  function ensureRestFallback() {
    if (hasPresence || restFallbackTried) return;
    restFallbackTried = true;
    loadREST({ silent: true });
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    const delay = reconnectDelay;
    reconnectDelay = Math.min(delay * 2, MAX_RECONNECT_DELAY);
    reconnectTimer = setTimeout(() => {
      reconnectTimer = 0;
      connectSocket();
    }, delay);
    ensureRestFallback();
  }

  function connectSocket() {
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
    clearHeartbeat();
    let ws;
    try {
      ws = new WebSocket(SOCKET_URL);
    } catch {
      scheduleReconnect();
      return;
    }
    socket = ws;
    clearTimeout(socketStartupTimer);
    socketStartupTimer = setTimeout(() => {
      if (!hasPresence) ensureRestFallback();
    }, REQUEST_TIMEOUT);

    ws.addEventListener("open", () => {
      reconnectDelay = INITIAL_RECONNECT_DELAY;
    });

    ws.addEventListener("message", (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }
      if (msg.op === 1) {
        const interval = Number(msg.d && msg.d.heartbeat_interval);
        clearHeartbeat();
        heartbeatTimer = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ op: 3 }));
        }, Number.isFinite(interval) && interval > 0 ? interval : 30000);
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_ids: [USER_ID] } }));
        return;
      }
      const presence = presenceFromMessage(msg);
      if (presence) {
        hasPresence = true;
        clearTimeout(socketStartupTimer);
        render(presence);
      } else if (msg.op === 0 && msg.t === "INIT_STATE") {
        ensureRestFallback();
      }
    });

    ws.addEventListener("close", () => {
      if (socket === ws) socket = null;
      clearTimeout(socketStartupTimer);
      clearHeartbeat();
      scheduleReconnect();
    });
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (!socket || socket.readyState !== WebSocket.OPEN) {
      clearTimeout(reconnectTimer);
      reconnectTimer = 0;
      reconnectDelay = INITIAL_RECONNECT_DELAY;
      connectSocket();
    }
  });
  connectSocket();

  const root = document.documentElement;
  const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
  const motionQuery = matchMedia("(prefers-reduced-motion: reduce)");
  let parallaxEnabled = finePointer && !motionQuery.matches;
  let pending = null;

  function resetParallax() {
    root.style.setProperty("--px", "0");
    root.style.setProperty("--py", "0");
  }

  function onMotionChange(event) {
    parallaxEnabled = finePointer && !event.matches;
    if (!parallaxEnabled) {
      pending = null;
      resetParallax();
    }
  }
  if (motionQuery.addEventListener) motionQuery.addEventListener("change", onMotionChange);
  else motionQuery.addListener(onMotionChange);

  if (finePointer) {
    let frameId = 0;
    let fallbackId = 0;

    function flush() {
      if (!pending) return;
      const { x, y } = pending;
      pending = null;
      root.style.setProperty("--px", x.toFixed(3));
      root.style.setProperty("--py", y.toFixed(3));
    }

    window.addEventListener("pointermove", (event) => {
      if (!parallaxEnabled) return;
      pending = {
        x: (event.clientX / window.innerWidth - 0.5) * 2,
        y: (event.clientY / window.innerHeight - 0.5) * 2,
      };
      if (!frameId) frameId = requestAnimationFrame(() => { frameId = 0; flush(); });
      if (!fallbackId) fallbackId = setTimeout(() => { fallbackId = 0; flush(); }, 32);
    }, { passive: true });

    document.addEventListener("pointerout", (event) => {
      if (event.relatedTarget === null) {
        pending = null;
        resetParallax();
      }
    });
  }

  const PALETTES = {
    NIGHT:   { sky1:"#0d1b2a", sky2:"#1b3a4b", hill:"#1d3a4a", hill2:"#173443", treeFar:"#123528", treeNear:"#0a1f18", ground:"#123a2a", grass:"#123528", grassDeep:"#0a1f18", panel:"#122d24", panel2:"#17382d", ink3:"#8fb7a5" },
    PREDAWN: { sky1:"#243a52", sky2:"#4b5f6a", hill:"#2b4a54", hill2:"#223f4a", treeFar:"#173528", treeNear:"#0d241c", ground:"#1c3b2c", grass:"#173528", grassDeep:"#0d241c", panel:"#163028", panel2:"#1d3f33", ink3:"#a9c3b4" },
    MORNING: { sky1:"#f9a03f", sky2:"#ffe0a3", hill:"#8fae6b", hill2:"#6f9a5a", treeFar:"#3f6b45", treeNear:"#21402c", ground:"#5e8a4f", grass:"#3f6b45", grassDeep:"#21402c", panel:"#2b3a26", panel2:"#3a4d31", ink3:"#ffe0ac" },
    DAY:     { sky1:"#8fd3e8", sky2:"#d9f2d0", hill:"#74c69d", hill2:"#52b788", treeFar:"#2d6a4f", treeNear:"#1b4332", ground:"#40916c", grass:"#2d6a4f", grassDeep:"#1b4332", panel:"#1d3b2f", panel2:"#27503d", ink3:"#a9d3bd" },
    DUSK:    { sky1:"#f4a261", sky2:"#ffd9a0", hill:"#8a9f68", hill2:"#6c8b58", treeFar:"#3a6442", treeNear:"#203c2a", ground:"#5a824c", grass:"#3a6442", grassDeep:"#203c2a", panel:"#2a3926", panel2:"#394b31", ink3:"#ffe0ac" },
  };
  const COLOR_STOPS = [
    { h: 0,    palette: PALETTES.NIGHT },
    { h: 5,    palette: PALETTES.PREDAWN },
    { h: 6.5,  palette: PALETTES.MORNING },
    { h: 8,    palette: PALETTES.DAY },
    { h: 17,   palette: PALETTES.DAY },
    { h: 18.5, palette: PALETTES.DUSK },
    { h: 20,   palette: PALETTES.NIGHT },
    { h: 24,   palette: PALETTES.NIGHT },
  ];

  function clampHour(value) {
    const number = Number(value);
    if (!Number.isFinite(number)) return 0;
    return ((number % 24) + 24) % 24;
  }

  function labelForHour(hour) {
    if (hour >= 5 && hour < 8) return "morning";
    if (hour >= 8 && hour < 18) return "day";
    return "night";
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function hexToRgb(hex) {
    const value = hex.replace("#", "");
    return [
      parseInt(value.slice(0, 2), 16),
      parseInt(value.slice(2, 4), 16),
      parseInt(value.slice(4, 6), 16),
    ];
  }

  function lerpColor(a, b, t) {
    const from = hexToRgb(a);
    const to = hexToRgb(b);
    return `rgb(${Math.round(lerp(from[0], to[0], t))}, ${Math.round(lerp(from[1], to[1], t))}, ${Math.round(lerp(from[2], to[2], t))})`;
  }

  function bracket(stops, hour) {
    for (let i = 0; i < stops.length - 1; i++) {
      if (hour >= stops[i].h && hour <= stops[i + 1].h) {
        const span = stops[i + 1].h - stops[i].h;
        return [stops[i], stops[i + 1], span > 0 ? (hour - stops[i].h) / span : 0];
      }
    }
    return [stops[stops.length - 1], stops[stops.length - 1], 0];
  }

  function timeStateAt(value) {
    const hour = clampHour(value);
    const [cFrom, cTo, ct] = bracket(CELESTIAL_KEYS, hour);
    const [pFrom, pTo, pt] = bracket(COLOR_STOPS, hour);
    const vars = {};
    Object.keys(pFrom.palette).forEach((key) => {
      const cssName = key
        .replace(/([A-Z])/g, "-$1")
        .replace(/([a-z])(\d)/g, "$1-$2")
        .toLowerCase();
      vars[`--${cssName}`] = lerpColor(pFrom.palette[key], pTo.palette[key], pt);
    });
    vars["--night-opacity"] = String(lerp(cFrom.night, cTo.night, ct));
    vars["--star-opacity"] = String(lerp(cFrom.stars, cTo.stars, ct));
    vars["--sun-x"] = `${lerp(cFrom.sunX, cTo.sunX, ct)}%`;
    vars["--sun-y"] = `${lerp(cFrom.sunY, cTo.sunY, ct)}%`;
    vars["--sun-opacity"] = String(lerp(cFrom.sunO, cTo.sunO, ct));
    vars["--moon-x"] = `${lerp(cFrom.moonX, cTo.moonX, ct)}%`;
    vars["--moon-y"] = `${lerp(cFrom.moonY, cTo.moonY, ct)}%`;
    vars["--moon-opacity"] = String(lerp(cFrom.moonO, cTo.moonO, ct));
    return { fractionalHour: hour, label: labelForHour(hour), vars };
  }

  function timeState(now) {
    const date = now instanceof Date ? now : new Date(now);
    const hour = date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600 + date.getMilliseconds() / 3600000;
    return timeStateAt(hour);
  }

  function SCENE_FOR_HOUR(hour) {
    return labelForHour(Number(hour));
  }

  const themeMeta = document.querySelector('meta[name="theme-color"]');

  function sceneReducedMotion() {
    return motionQuery.matches || matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  let displayedVars = null;
  let tweenFrame = 0;
  let tweenFallback = 0;
  let previewHour = null;

  function cancelTween() {
    if (tweenFrame) cancelAnimationFrame(tweenFrame);
    if (tweenFallback) clearTimeout(tweenFallback);
    tweenFrame = 0;
    tweenFallback = 0;
  }

  function scheduleTween(step) {
    tweenFrame = requestAnimationFrame((now) => {
      cancelTween();
      step(now);
    });
    tweenFallback = setTimeout(() => {
      cancelTween();
      step(performance.now());
    }, 32);
  }

  function writeVars(vars) {
    const body = document.body;
    Object.keys(vars).forEach((key) => body.style.setProperty(key, vars[key]));
    displayedVars = Object.assign({}, vars);
  }

  function lerpVarValue(from, to, t) {
    if (typeof from === "string" && typeof to === "string" && from.endsWith("%") && to.endsWith("%")) {
      return `${lerp(parseFloat(from), parseFloat(to), t)}%`;
    }
    if (
      typeof from === "string" &&
      typeof to === "string" &&
      from.startsWith("rgb(") &&
      to.startsWith("rgb(")
    ) {
      const a = from.match(/-?\d+(?:\.\d+)?/g).map(Number);
      const b = to.match(/-?\d+(?:\.\d+)?/g).map(Number);
      return `rgb(${Math.round(lerp(a[0], b[0], t))}, ${Math.round(lerp(a[1], b[1], t))}, ${Math.round(lerp(a[2], b[2], t))})`;
    }
    const a = Number(from);
    const b = Number(to);
    if (Number.isFinite(a) && Number.isFinite(b)) return String(lerp(a, b, t));
    return to;
  }

  function applyTimeState(state, { durationMs = null } = {}) {
    cancelTween();

    const body = document.body;
    body.dataset.scene = state.label;
    syncFireflyAvailability(state.label);
    if (themeMeta) themeMeta.setAttribute("content", SCENE_THEME[state.label]);

    const explicit = durationMs !== null && durationMs !== undefined;
    const effective = explicit
      ? Number(durationMs)
      : location.search.indexOf("instant") >= 0
        ? 0
        : 60000;

    if (!Number.isFinite(effective) || effective <= 0 || sceneReducedMotion()) {
      writeVars(state.vars);
      return state.label;
    }

    const fromVars = displayedVars ? Object.assign({}, displayedVars) : timeState(new Date()).vars;
    const started = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - started) / effective);
      const vars = {};
      Object.keys(state.vars).forEach((key) => {
        vars[key] = lerpVarValue(fromVars[key], state.vars[key], t);
      });
      writeVars(vars);
      if (t < 1) {
        scheduleTween(step);
      } else {
        cancelTween();
        writeVars(state.vars);
      }
    };
    scheduleTween(step);
    return state.label;
  }

  function isAnimating() {
    return tweenFrame !== 0 || tweenFallback !== 0;

  function setScene(scene) {

  /* ---------- kingdom interactions ---------- */
  const fireflies = [...document.querySelectorAll(".firefly")];
  const fireflyCount = document.getElementById("fireflyCount");
  const fireflyStatus = document.getElementById("fireflyStatus");
  const sparks = document.getElementById("sparks");
  const hero = document.getElementById("hero");
  const campfire = document.getElementById("campfire");

  const caughtOnce = new Set();
  const cardEl = document.querySelector(".card");
  const respawnTimers = new Map();
  let roundResetTimer = 0;

  /* Daylight hides the layer, so disable the buttons to pull them out of the tab order.
     Catching itself only uses aria-disabled, keeping focus on visible fireflies. */
  function syncFireflyAvailability(scene) {
    const active = (scene || document.body.dataset.scene) !== "day";
    document.querySelectorAll(".firefly").forEach((fly) => { fly.disabled = !active; });
  }

  /* Keep fireflies in the open scenery around the card so every one is visible and catchable. */
  function placeFirefly(fly) {
    const r = cardEl.getBoundingClientRect();
    const left = r.left + window.scrollX;
    const right = r.right + window.scrollX;
    const top = r.top + window.scrollY;
    const bottom = r.bottom + window.scrollY;
    const docW = Math.max(document.documentElement.scrollWidth, window.innerWidth);
    const docH = Math.max(document.documentElement.scrollHeight, window.innerHeight);
    const gap = 28;
    const zones = [];
    if (top - gap - 8 > 16) zones.push({ x: 8, y: 8, w: docW - 16, h: top - gap - 8 });
    if (docH - bottom - gap - 8 > 16) zones.push({ x: 8, y: bottom + gap, w: docW - 16, h: docH - bottom - gap - 8 });
    if (left - gap - 8 > 16) zones.push({ x: 8, y: top, w: left - gap - 8, h: r.height });
    if (docW - right - gap - 8 > 16) zones.push({ x: right + gap, y: top, w: docW - right - gap - 8, h: r.height });
    const zone = zones.length
      ? zones[Math.floor(Math.random() * zones.length)]
      : { x: 8, y: 8, w: docW - 16, h: docH - 16 };
    fly.style.left = (zone.x + Math.random() * zone.w).toFixed(0) + "px";
    fly.style.top = (zone.y + Math.random() * zone.h).toFixed(0) + "px";
  }

  function burst(x, y) {
    for (let i = 0; i < 6; i++) {
      const spark = document.createElement("span");
      spark.className = "spark";
      spark.style.left = x + "px";
      spark.style.top = y + "px";
      const angle = (Math.PI * 2 * i) / 6;
      spark.style.setProperty("--dx", Math.cos(angle) * 28 + "px");
      spark.style.setProperty("--dy", Math.sin(angle) * 28 + "px");
      sparks.appendChild(spark);
      setTimeout(() => spark.remove(), 650);
    }
  }

  /* One round = six distinct catches. Named so verification can call it directly. */
  function resetFireflyRound() {

    inputTimer = setTimeout(() => { inputMode = "pointer"; }, 1500);
    moveHero(heroX + (event.key === "ArrowLeft" ? -7 : 7));

  function moveHeroTo(xPercent, yPercent) {

    const x = Number(xPercent);

      (event.clientX / window.innerWidth) * 100,
      (event.clientY / window.innerHeight) * 100,
    );

    const cx = rect.left + rect.width / 2;

    /* Bright noise burst that sweeps down into a low "wfuuh". */
    var s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain();
    s.buffer=noiseBuf; f.type='lowpass';
    f.frequency.setValueAtTime(6500,t);
    f.frequency.exponentialRampToValueAtTime(320,t+0.55);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.16,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t+0.62);
    /* Short low thump underneath. */
    var o=ctx.createOscillator(), og=ctx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(130,t);
    o.frequency.exponentialRampToValueAtTime(42,t+0.28);
    og.gain.setValueAtTime(0.12,t);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
    o.connect(og); og.connect(master);
    o.start(t); o.stop(t+0.34);
  }
  function updateFire(){
    if(!ctx) return;
    var lit=campfire.dataset.lit==='true';
    if(lit && !wasLit) fireIgnition();
    wasLit=lit;
    fireGain.gain.cancelScheduledValues(ctx.currentTime);
    fireGain.gain.setTargetAtTime(lit?0.018:0,ctx.currentTime,lit?0.18:0.3);
    if(lit && !crackleTimer) scheduleCrackle();
    else if(!lit && crackleTimer){ clearTimeout(crackleTimer); crackleTimer=null; }
  }
  new MutationObserver(updateFire).observe(campfire,{attributes:true,attributeFilter:['data-lit']});

  /* Hidden time preview: type "chronia" anywhere outside a text field. */
  var typed='';
  var liveMinutesAtOpen=0;
  function pad2(n){ return String(n).padStart(2,'0'); }
  function clockMinutes(){
    var now=new Date();
    return now.getHours()*60+now.getMinutes();
  }
  function updateReadout(value){
    var minutes=Math.max(0,Math.min(1439,Math.round(Number(value)||0)));
    sceneReadout.textContent=pad2(Math.floor(minutes/60))+':'+pad2(minutes%60);
    return minutes;
  }
  function openPreview(){
    liveMinutesAtOpen=clockMinutes();
    sceneRange.value=String(liveMinutesAtOpen);
    updateReadout(liveMinutesAtOpen);
    debugMenu.hidden=false;
    sceneRange.focus();
  }
  function closePreview(){
    if(debugMenu.hidden){ typed=''; return; }
    sceneRange.value=String(liveMinutesAtOpen);
    updateReadout(liveMinutesAtOpen);
    debugMenu.hidden=true;
    if(window.ChroniaTime && typeof window.ChroniaTime.resume==='function') window.ChroniaTime.resume();
    typed='';
  }
  function applyRange(){
    var minutes=updateReadout(sceneRange.value);
    if(window.ChroniaTime && typeof window.ChroniaTime.preview==='function') window.ChroniaTime.preview(minutes/60);
  }
  sceneRange.addEventListener('input',applyRange);
  sceneLive.addEventListener('click',closePreview);
  document.addEventListener('keydown',function(ev){
    if(ev.ctrlKey||ev.altKey||ev.metaKey) return;
    if(ev.key==='Escape'){
      if(!debugMenu.hidden){ closePreview(); ev.preventDefault(); }
      typed='';
      return;
    }
    var t=ev.target;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
    if(/^[a-z]$/i.test(ev.key)){
      typed=(typed+ev.key.toLowerCase()).slice(-7);
      if(typed==='chronia'){
        typed='';
        if(debugMenu.hidden) openPreview(); else closePreview();
      }
    } else {
      typed='';
    }
  });
  document.addEventListener('pointerdown',function(ev){
    if(!debugMenu.hidden && !debugMenu.contains(ev.target)) closePreview();
  });
  window.__chroniaSlider={panel:debugMenu,range:sceneRange,readout:sceneReadout,open:openPreview,close:closePreview};
})();
</script>
